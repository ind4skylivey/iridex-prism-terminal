name: CI

on:
  push:
  pull_request:

jobs:
  lint-test-bench:
    runs-on: ubuntu-latest
    env:
      PRISM_SYNC_DISABLE_PERSIST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --all-targets --all-features

      - name: Cargo bench (prompt)
        run: cargo bench --bench prompt -- --sample-size=50 --measurement-time=3

      - name: Cargo bench (dotfiles)
        run: cargo bench --bench dotfiles -- --sample-size=50 --measurement-time=3

      - name: Cargo bench (widgets)
        run: cargo bench --bench widgets -- --sample-size=50 --measurement-time=3

      - name: Cargo bench (gallery)
        run: cargo bench --bench gallery -- --sample-size=50 --measurement-time=3

      - name: Compare benchmarks
        run: scripts/bench-compare.sh --threshold 0.20
