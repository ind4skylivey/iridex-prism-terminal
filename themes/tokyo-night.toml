[metadata]
name = "Tokyo Night"
author = "ind4skylivey"
version = "1.0.0"
description = "Tokyo Night inspired palette"

[colors]
background = "#1a1b26"
foreground = "#c0caf5"
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#ff9e64"
green = "#73daca"
yellow = "#f4e7a1"
blue = "#89ddff"
magenta = "#c0caf5"
cyan = "#b4f9f8"
white = "#cfc9f5"

[prompt]
style = "powerline"
show_user = true
show_host = false
show_time = true
show_git = true
separator = ""

[prompt.segments]
user = { bg = "#7aa2f7", fg = "#1a1b26" }
path = { bg = "#565f89", fg = "#c0caf5" }
git  = { bg = "#9ece6a", fg = "#1a1b26" }

[widgets]
enabled = ["git-status", "clock", "system"]

[context_rules]
night_theme = "tokyo-night"
