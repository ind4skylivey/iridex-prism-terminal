name: CI

on:
  push:
  pull_request:

jobs:
  lint-test-bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --all-targets --all-features

      - name: Cargo bench (prompt subset)
        run: cargo bench --bench prompt -- --sample-size=30 --measurement-time=2

      - name: Compare prompt benchmarks
        run: scripts/bench-compare.sh --threshold 0.10
